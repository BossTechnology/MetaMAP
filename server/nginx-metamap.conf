# MetaMAP simulation — metamap.bzzzbx.com
# Example nginx server block. Mirror whatever bob.bzzzbx.com already uses
# (certificates, logging, upstream names); only the paths below are MetaMAP-specific.

server {
    listen 80;
    server_name metamap.bzzzbx.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name metamap.bzzzbx.com;

    # Same certificate setup as bob.bzzzbx.com (wildcard *.bzzzbx.com or its own)
    ssl_certificate     /etc/letsencrypt/live/metamap.bzzzbx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metamap.bzzzbx.com/privkey.pem;

    root /var/www/metamap;          # contents of the metamap/ folder in this package

    # Bare address opens the engine
    location = / { return 302 /engine.html; }

    location = /engine.html {
        add_header Cache-Control "no-cache" always;   # always pick up new versions
        include /etc/nginx/snippets/metamap-headers.conf;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/snippets/metamap-headers.conf;
    }

    # BOBee → the same AI service BOb uses (same-origin for the browser)
    location = /api/ai {
        limit_req zone=metamap_ai burst=10 nodelay;   # see http{} block below
        client_max_body_size 256k;
        proxy_pass http://BOB_AI_UPSTREAM/api/ai;     # ← replace with BOb's AI service address
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Engine metamap;
        proxy_read_timeout 60s;
    }

    location / { try_files $uri =404; }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ── Put this in the http {} block (once per server) ──
